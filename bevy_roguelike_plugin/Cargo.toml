[package]
name = "bevy_roguelike_plugin"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
debug = ["colored"]

[dependencies]
vec_walk_dir = { path = "../vec_walk_dir" }
bevy_roguelike_combat = { path = "../bevy_roguelike_combat" }
map_generator = { path = "../map_generator" }
bevy_inventory = { path = "../bevy_inventory" }
bevy_inventory_ui = { path = "../bevy_inventory_ui" }
bevy_tweening = "0.15.0"
bevy_common_assets = { version = "0.16.0", features = ["ron"] }
line_drawing = "1"
rand = "0.10.1"
serde = "1"
ron = "0.12.1"
strum = "0.28.0"
strum_macros = "0.28.0"
colored = { version = "3", optional = true }

[dependencies.bevy]
version = "0.18.1"
default-features = false
